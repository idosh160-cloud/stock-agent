name: Hourly Market Scanner

on:
  workflow_dispatch:  # הרצה ידנית בלבד — מהדשבורד או מ-GitHub

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic yfinance finviz requests python-dotenv pytz

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scanner.py

      - name: Push scan results to repo
        run: |
          git config user.name "Stock Scanner Bot"
          git config user.email "bot@stock-agent"
          git add scan_results.json
          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
